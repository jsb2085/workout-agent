services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/physique-photos;
      exit 0;
      "

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://workout:workout@db:5432/workout
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please-use-32+}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "43200"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: physique-photos
      MINIO_SECURE: "false"
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-dev-mcp-agent-token}
      EXERCISEDB_API_KEY: ${EXERCISEDB_API_KEY:-}
      EXERCISEDB_API_HOST: ${EXERCISEDB_API_HOST:-edb-with-videos-and-images-by-ascendapi.p.rapidapi.com}
      EXERCISEDB_BASE_URL: ${EXERCISEDB_BASE_URL:-}
      EXERCISEDB_TIMEOUT_SECONDS: ${EXERCISEDB_TIMEOUT_SECONDS:-15}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      NOTION_TEMPLATE_ID: ${NOTION_TEMPLATE_ID:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
