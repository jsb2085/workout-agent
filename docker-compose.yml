services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-dev-mcp-agent-token}
      EXERCISEDB_API_KEY: ${EXERCISEDB_API_KEY:-}
      EXERCISEDB_API_HOST: ${EXERCISEDB_API_HOST:-edb-with-videos-and-images-by-ascendapi.p.rapidapi.com}
      EXERCISEDB_BASE_URL: ${EXERCISEDB_BASE_URL:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      NOTION_LIFTS_DATABASE_ID: ${NOTION_LIFTS_DATABASE_ID:-}
      NOTION_LOGS_DATABASE_ID: ${NOTION_LOGS_DATABASE_ID:-}
      NOTION_GOALS_DATABASE_ID: ${NOTION_GOALS_DATABASE_ID:-}
      NOTION_LOCATIONS_DATABASE_ID: ${NOTION_LOCATIONS_DATABASE_ID:-}
      NOTION_STATS_DATABASE_ID: ${NOTION_STATS_DATABASE_ID:-}
      NOTION_TEMPLATE_ID: ${NOTION_TEMPLATE_ID:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      CORS_ORIGINS: "*"
